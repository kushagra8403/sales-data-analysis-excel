<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#f7f8fa"/><text x="50" y="55" font-family="Arial" font-size="30" font-weight="700">Customer Churn &amp; Retention</text><text x="50" y="85" font-family="Arial" font-size="16">Churn rate • MRR at risk • plan and tenure segmentation</text><g font-family="Arial"><rect x="50" y="120" width="250" height="100" fill="white" stroke="#ddd"/><text x="70" y="155">Churn Rate</text><text x="70" y="195" font-size="30" font-weight="700">KPI</text><rect x="325" y="120" width="250" height="100" fill="white" stroke="#ddd"/><text x="345" y="155">Active MRR</text><text x="345" y="195" font-size="30" font-weight="700">KPI</text><rect x="600" y="120" width="250" height="100" fill="white" stroke="#ddd"/><text x="620" y="155">Revenue at Risk</text><text x="620" y="195" font-size="30" font-weight="700">KPI</text><rect x="875" y="120" width="250" height="100" fill="white" stroke="#ddd"/><text x="895" y="155">Customers</text><text x="895" y="195" font-size="30" font-weight="700">2,500</text><rect x="50" y="255" width="520" height="350" fill="white" stroke="#ddd"/><text x="75" y="295" font-size="19" font-weight="700">Churn by Plan</text><text x="80" y="350">Basic</text><rect x="150" y="332" width="300" height="28"/><text x="80" y="405">Standard</text><rect x="150" y="387" width="250" height="28"/><text x="80" y="460">Premium</text><rect x="150" y="442" width="190" height="28"/><rect x="600" y="255" width="525" height="350" fill="white" stroke="#ddd"/><text x="625" y="295" font-size="19" font-weight="700">Risk by Tenure</text><text x="625" y="345">0–6 months</text><text x="625" y="395">7–12 months</text><text x="625" y="445">13–24 months</text><text x="625" y="495">25+ months</text><text x="625" y="555" font-size="15">Use filters to identify high-risk customer segments.</text></g></svg>